<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- strip the referrer so web-sourced card images (Wix, blogs, etc.) don't get
         referrer-blocked when hotlinked from the deployed site -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- THE UNFURL — for a link-shared product, the WhatsApp/iMessage preview IS the first screen.
         Absolute URLs on purpose: scrapers don't resolve relative paths against a SPA. -->
    <meta name="description" content="Swipe. Save. Match. This weekend's Amsterdam plans — no account, right in the browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WKNDR" />
    <meta property="og:title" content="WKNDR — the app" />
    <meta property="og:description" content="Swipe. Save. Match. This weekend in Amsterdam — no account, right in the browser." />
    <!-- https://nessim-higson.github.io/wkndr is stamped at build time by vite.config: the GitHub Pages URL for the
         default build, https://app.wkndr.xyz for the WKNDR_DEPLOY=domain build. -->
    <meta property="og:url" content="https://nessim-higson.github.io/wkndr/" />
    <!-- THIS WEEKEND'S actual picks, not a fixed card. /share/og-2026-08-08.png is stamped by vite.config as
         /share/og-<saturday>.png — a filename that CHANGES WEEKLY on purpose, because WhatsApp /
         iMessage / Slack cache an unfurl by URL and a fixed name would serve a stale weekend.
         The poster script writes that exact file on the same weekly cron. -->
    <meta property="og:image" content="https://nessim-higson.github.io/wkndr/share/og-2026-08-08.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://nessim-higson.github.io/wkndr/" />
    <link rel="icon" type="image/png" href="https://nessim-higson.github.io/wkndr/favicon.png" />
    <link rel="apple-touch-icon" href="https://nessim-higson.github.io/wkndr/apple-touch-icon.png" />
    <!-- installable: home-screen icon + standalone chrome (relative start_url works on both origins) -->
    <link rel="manifest" href="https://nessim-higson.github.io/wkndr/manifest.webmanifest" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <!-- Clash Display — the WKNDR display voice (wordmark, hero line, titles) -->
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" />
    <title>WKNDR — Amsterdam</title>
    <script type="module" crossorigin src="/wkndr/versions/v10-19/assets/index-B-pddm2u.js"></script>
    <link rel="stylesheet" crossorigin href="/wkndr/versions/v10-19/assets/index-D9W32JD9.css">
  </head>

</html>
